<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="The same hidden wall shown three times: barely sketched, then clearly outlined, then solid — with a question asked between each stage.">
  <defs>
    <linearGradient id="pl-ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1e1"/>
      <stop offset="46%" stop-color="#ffdfbd"/>
      <stop offset="100%" stop-color="#f7b47c"/>
    </linearGradient>
    <radialGradient id="pl-petrol" cx="97%" cy="103%" r="72%">
      <stop offset="0" stop-color="#1d3a44" stop-opacity=".38"/>
      <stop offset="70%" stop-color="#1d3a44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pl-bloom" cx="16%" cy="6%" r="62%">
      <stop offset="0" stop-color="#fff9f0"/>
      <stop offset="100%" stop-color="#fff9f0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pl-mesh" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#1d3a44" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#pl-ground)"/>
  <rect width="1200" height="675" fill="url(#pl-bloom)"/>
  <rect width="1200" height="675" fill="url(#pl-mesh)"/>
  <rect width="1200" height="675" fill="url(#pl-petrol)"/>

  <g fill="none" stroke="#22545a" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M276 350H340M332 343l8 7-8 7"/>
    <path d="M452 350H524M516 343l8 7-8 7"/>
    <path d="M676 350H748M740 343l8 7-8 7"/>
    <path d="M852 350H924M916 343l8 7-8 7"/>
  </g>

  <!-- seeded into the persona, and forbidden to name -->
  <circle cx="200" cy="350" r="68" fill="#142129"/>
  <circle cx="200" cy="350" r="68" fill="none" stroke="#6094a5" stroke-opacity=".45" stroke-width="1.5"/>
  <g fill="none" stroke="#6094a5" stroke-opacity=".34" stroke-width="2.6" stroke-dasharray="6 6">
    <rect x="169" y="328" width="28" height="20" rx="3"/><rect x="203" y="328" width="28" height="20" rx="3"/>
    <rect x="169" y="352" width="13" height="20" rx="3"/><rect x="186" y="352" width="28" height="20" rx="3"/><rect x="218" y="352" width="13" height="20" rx="3"/>
  </g>

  <g>
    <circle cx="400" cy="350" r="44" fill="#ffffff" fill-opacity=".92"/>
    <circle cx="400" cy="350" r="44" fill="none" stroke="#22545a" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M388 340a12 12 0 1 1 16 10c-4 2.4-6 5.2-6 10" fill="none" stroke="#2b6a70" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="398" cy="370" r="3.2" fill="#2b6a70"/>
  </g>

  <!-- one question in, and the shape of it starts to show -->
  <circle cx="600" cy="350" r="68" fill="#142129"/>
  <circle cx="600" cy="350" r="68" fill="none" stroke="#6094a5" stroke-opacity=".45" stroke-width="1.5"/>
  <g fill="none" stroke="#6094a5" stroke-opacity=".9" stroke-width="3">
    <rect x="569" y="328" width="28" height="20" rx="3"/><rect x="603" y="328" width="28" height="20" rx="3"/>
    <rect x="569" y="352" width="13" height="20" rx="3"/><rect x="586" y="352" width="28" height="20" rx="3"/><rect x="618" y="352" width="13" height="20" rx="3"/>
  </g>

  <g>
    <circle cx="800" cy="350" r="44" fill="#ffffff" fill-opacity=".92"/>
    <circle cx="800" cy="350" r="44" fill="none" stroke="#22545a" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M788 340a12 12 0 1 1 16 10c-4 2.4-6 5.2-6 10" fill="none" stroke="#2b6a70" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="798" cy="370" r="3.2" fill="#2b6a70"/>
  </g>

  <!-- named at last -->
  <circle cx="1000" cy="350" r="68" fill="#e8762f"/>
  <circle cx="1000" cy="350" r="79" fill="none" stroke="#c8551c" stroke-opacity=".45" stroke-width="2"/>
  <g fill="#fff9f0">
    <rect x="969" y="328" width="28" height="20" rx="3"/><rect x="1003" y="328" width="28" height="20" rx="3"/>
    <rect x="969" y="352" width="13" height="20" rx="3"/><rect x="986" y="352" width="28" height="20" rx="3"/><rect x="1018" y="352" width="13" height="20" rx="3"/>
  </g>
</svg>
