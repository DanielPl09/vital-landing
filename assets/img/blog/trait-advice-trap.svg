<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="A client's opening line, three questions in a row, and an advice block at the end. One path goes through the questions; an orange arc leaps straight over them onto the advice.">
  <defs>
    <linearGradient id="at-ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1e1"/>
      <stop offset="46%" stop-color="#ffdfbd"/>
      <stop offset="100%" stop-color="#f7b47c"/>
    </linearGradient>
    <radialGradient id="at-petrol" cx="97%" cy="103%" r="72%">
      <stop offset="0" stop-color="#1d3a44" stop-opacity=".38"/>
      <stop offset="70%" stop-color="#1d3a44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="at-bloom" cx="16%" cy="6%" r="62%">
      <stop offset="0" stop-color="#fff9f0"/>
      <stop offset="100%" stop-color="#fff9f0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="at-mesh" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#1d3a44" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#at-ground)"/>
  <rect width="1200" height="675" fill="url(#at-bloom)"/>
  <rect width="1200" height="675" fill="url(#at-mesh)"/>
  <rect width="1200" height="675" fill="url(#at-petrol)"/>

  <!-- basic questioning 101: the work the coach actually does -->
  <path d="M228 420H920" fill="none" stroke="#2b6a70" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M910 411l10 9-10 9" fill="none" stroke="#2b6a70" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the reflex: straight over the clarifying work, onto the answer -->
  <path d="M185 358C330 150 800 150 972 372" fill="none" stroke="#e8762f" stroke-width="5" stroke-linecap="round"/>
  <path d="M975.7 376.7 962.4 369.4 971.8 362Z" fill="#c8551c"/>

  <circle cx="170" cy="420" r="58" fill="#142129"/>
  <circle cx="170" cy="420" r="58" fill="none" stroke="#6094a5" stroke-opacity=".45" stroke-width="1.5"/>
  <path d="M144 396h52a12 12 0 0 1 12 12v20a12 12 0 0 1-12 12h-30l-14 12v-12h-8a12 12 0 0 1-12-12v-20a12 12 0 0 1 12-12z"
        fill="none" stroke="#dcebee" stroke-width="3.4" stroke-linejoin="round"/>

  <g>
    <circle cx="470" cy="420" r="38" fill="#ffffff" fill-opacity=".92"/>
    <circle cx="470" cy="420" r="38" fill="none" stroke="#22545a" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M459 410a11 11 0 1 1 14.7 9.2c-3.7 2.2-5.5 4.8-5.5 9.2" fill="none" stroke="#2b6a70" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="468.2" cy="438" r="3" fill="#2b6a70"/>
  </g>
  <g>
    <circle cx="620" cy="420" r="38" fill="#ffffff" fill-opacity=".92"/>
    <circle cx="620" cy="420" r="38" fill="none" stroke="#22545a" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M609 410a11 11 0 1 1 14.7 9.2c-3.7 2.2-5.5 4.8-5.5 9.2" fill="none" stroke="#2b6a70" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="618.2" cy="438" r="3" fill="#2b6a70"/>
  </g>
  <g>
    <circle cx="770" cy="420" r="38" fill="#ffffff" fill-opacity=".92"/>
    <circle cx="770" cy="420" r="38" fill="none" stroke="#22545a" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M759 410a11 11 0 1 1 14.7 9.2c-3.7 2.2-5.5 4.8-5.5 9.2" fill="none" stroke="#2b6a70" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="768.2" cy="438" r="3" fill="#2b6a70"/>
  </g>

  <rect x="930" y="380" width="170" height="80" rx="20" fill="#e8762f"/>
  <path d="M958 408h114M958 432h72" fill="none" stroke="#fff9f0" stroke-width="4.2" stroke-linecap="round"/>
</svg>
