<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Two panels. Left: a coach and a domain expert above a short bar. Right: the same two plus a data-science agent above a much taller bar.">
  <defs>
    <linearGradient id="ds-ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1e1"/>
      <stop offset="46%" stop-color="#ffdfbd"/>
      <stop offset="100%" stop-color="#f7b47c"/>
    </linearGradient>
    <radialGradient id="ds-petrol" cx="97%" cy="103%" r="72%">
      <stop offset="0" stop-color="#1d3a44" stop-opacity=".38"/>
      <stop offset="70%" stop-color="#1d3a44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ds-bloom" cx="16%" cy="6%" r="62%">
      <stop offset="0" stop-color="#fff9f0"/>
      <stop offset="100%" stop-color="#fff9f0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ds-mesh" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#1d3a44" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#ds-ground)"/>
  <rect width="1200" height="675" fill="url(#ds-bloom)"/>
  <rect width="1200" height="675" fill="url(#ds-mesh)"/>
  <rect width="1200" height="675" fill="url(#ds-petrol)"/>

  <rect x="100" y="110" width="460" height="460" rx="26" fill="#ffffff" fill-opacity=".44" stroke="#22545a" stroke-opacity=".2" stroke-width="1.5"/>
  <rect x="640" y="110" width="460" height="460" rx="26" fill="#ffffff" fill-opacity=".78" stroke="#c8551c" stroke-opacity=".38" stroke-width="1.8"/>

  <!-- two obvious seats -->
  <g>
    <circle cx="250" cy="215" r="52" fill="#ffffff" fill-opacity=".9"/>
    <circle cx="250" cy="215" r="52" fill="none" stroke="#22545a" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M226 191h48a10 10 0 0 1 10 10v18a10 10 0 0 1-10 10h-26l-12 10v-10h-10a10 10 0 0 1-10-10v-18a10 10 0 0 1 10-10z"
          fill="none" stroke="#2b6a70" stroke-width="3.2" stroke-linejoin="round"/>
  </g>
  <g>
    <circle cx="410" cy="215" r="52" fill="#ffffff" fill-opacity=".9"/>
    <circle cx="410" cy="215" r="52" fill="none" stroke="#22545a" stroke-opacity=".3" stroke-width="1.5"/>
    <g fill="none" stroke="#2b6a70" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M410 202c-5-5-14-6-20-5v31c6-1 15 0 20 5 5-5 14-6 20-5v-31c-6-1-15 0-20 5z"/>
      <path d="M410 202v31"/>
    </g>
  </g>

  <path d="M160 505H500" fill="none" stroke="#22545a" stroke-opacity=".28" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="280" y="365" width="100" height="140" rx="8" fill="#2b6a70" fill-opacity=".32"/>

  <!-- the same two, plus the seat you would not have guessed -->
  <g>
    <circle cx="730" cy="215" r="52" fill="#ffffff" fill-opacity=".9"/>
    <circle cx="730" cy="215" r="52" fill="none" stroke="#22545a" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M706 191h48a10 10 0 0 1 10 10v18a10 10 0 0 1-10 10h-26l-12 10v-10h-10a10 10 0 0 1-10-10v-18a10 10 0 0 1 10-10z"
          fill="none" stroke="#2b6a70" stroke-width="3.2" stroke-linejoin="round"/>
  </g>
  <g>
    <circle cx="870" cy="215" r="52" fill="#ffffff" fill-opacity=".9"/>
    <circle cx="870" cy="215" r="52" fill="none" stroke="#22545a" stroke-opacity=".3" stroke-width="1.5"/>
    <g fill="none" stroke="#2b6a70" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M870 202c-5-5-14-6-20-5v31c6-1 15 0 20 5 5-5 14-6 20-5v-31c-6-1-15 0-20 5z"/>
      <path d="M870 202v31"/>
    </g>
  </g>
  <g>
    <circle cx="1010" cy="215" r="52" fill="#e8762f"/>
    <circle cx="1010" cy="215" r="63" fill="none" stroke="#c8551c" stroke-opacity=".5" stroke-width="2" stroke-dasharray="7 8"/>
    <g fill="none" stroke="#fff9f0" stroke-width="4.2" stroke-linecap="round">
      <path d="M994 229v-18M1010 229v-32M1026 229v-11"/>
    </g>
    <circle cx="1048" cy="180" r="15" fill="#c8551c"/>
    <path d="M1041 180h14M1048 173v14" fill="none" stroke="#fff9f0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <path d="M700 505H1040" fill="none" stroke="#22545a" stroke-opacity=".28" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="820" y="308" width="100" height="197" rx="8" fill="#e8762f"/>
</svg>
